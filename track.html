<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order</title>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Segoe UI',Arial,sans-serif; background:#f4f6f9; }

.navbar{ position:fixed; top:0; left:0; width:100%; background:#1f2937; padding:12px; display:flex; justify-content:center; gap:10px; }
.navbar a{ color:white; text-decoration:none; padding:8px 12px; border-radius:6px; }
.navbar a:hover{ background:#374151; }

.container{ background:white; max-width:420px; margin:100px auto; padding:20px; border-radius:12px; }

h2{text-align:center;margin-bottom:15px;}

input{ width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc; }

button{ width:100%; padding:12px; background:#3b82f6; color:white; border:none; border-radius:8px; cursor:pointer; }

#msgBox{ text-align:center; margin-top:10px; font-weight:bold; }

.serving{ background:green;color:white;padding:10px;border-radius:8px;margin-top:10px;}
.queue{ background:#2563eb;color:white;padding:10px;border-radius:8px;margin-top:10px;}

.info{ margin-top:8px; }
.item{ background:#f3f4f6;padding:6px;margin-top:5px;border-radius:6px; }
.total{ margin-top:10px;font-weight:bold; }

.pending{ color:#f59e0b; font-weight:bold; }
.paid{ color:#16a34a; font-weight:bold; }
.failed{ color:#dc2626; font-weight:bold; }

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Orders</a>
<a href="track.html">Track</a>
</div>

<div class="container">

<h2>Track Your Order</h2>

<div id="msgBox"></div>

<input type="number" id="orderNumber" placeholder="Enter your queue number">
<button onclick="startTracking()">Track Order</button>

<div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const supabaseClient = window.supabaseClient;
let currentOrderNumber = null;

const msgBox = document.getElementById("msgBox");
const result = document.getElementById("result");

function showMessage(msg,type){
  msgBox.innerHTML = msg;
  msgBox.className = type;
}

// ✅ AUTO LOAD FROM URL (FIXED)
function autoLoad(){
  const params = new URLSearchParams(window.location.search);
  const number = params.get("order_number");

  if(number){
    currentOrderNumber = parseInt(number);
    document.getElementById("orderNumber").value = number;
    loadOrder();
  }
}
autoLoad();

// ✅ START TRACKING
function startTracking(){
  const number = parseInt(document.getElementById("orderNumber").value);

  if(!number){
    showMessage("Enter valid order number","error");
    return;
  }

  currentOrderNumber = number;
  loadOrder();
}

// ✅ LOAD ORDER
async function loadOrder(){
  if(!currentOrderNumber) return;

  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("order_number", currentOrderNumber)
    .single();

  if(error){
    showMessage("Order not found","error");
    result.innerHTML="";
    return;
  }

  // 🔥 PAYMENT STATUS FIX
  let paymentStatusHTML = "";

  if(data.payment_status === "Paid"){
    paymentStatusHTML = `<span class="paid">✅ Paid</span>`;
  } else if(data.payment_status === "Pending"){
    paymentStatusHTML = `<span class="pending">⏳ Waiting for payment...</span>`;
  } else {
    paymentStatusHTML = `<span class="failed">❌ Failed</span>`;
  }

  // 🔥 SERVING LOGIC
  const { data: serving } = await supabaseClient
    .from("orders")
    .select("order_number")
    .neq("status","Completed")
    .order("order_number",{ascending:true})
    .limit(1);

  let currentServing = serving?.[0]?.order_number || 0;

  let peopleAhead = currentOrderNumber - currentServing;
  if(peopleAhead < 0) peopleAhead = 0;

  // 🔥 ITEMS FIX
  let itemsHTML = "";
  let total = 0;

  if(data.items){
    let items = JSON.parse(data.items);

    items.forEach(item=>{
      total += item.price * (item.quantity || 1);
      itemsHTML += `<div class="item">${item.item_name} x ${item.quantity || 1} - Ksh ${item.price}</div>`;
    });
  }

  // 🔥 RENDER
  result.innerHTML = `
    <div class="serving">Currently Serving: #${currentServing}</div>
    <div class="queue">Your Number: #${currentOrderNumber}</div>

    <div class="info">People Ahead: ${peopleAhead}</div>
    <div class="info">Order Status: ${data.status}</div>
    <div class="info">Payment: ${paymentStatusHTML}</div>

    <br>
    <b>Items:</b>
    ${itemsHTML}

    <div class="total">Total: Ksh ${total}</div>
  `;
}

// 🔥 AUTO REFRESH
setInterval(loadOrder,3000);
</script>

</body>
</html>
