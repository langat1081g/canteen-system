<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Order</title>

<style>
body{
font-family:Arial;
background:#eef2f7;
}

.container{
background:white;
max-width:400px;
margin:80px auto;
padding:20px;
border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

<h2>Track Order</h2>

<input type="number" id="orderNumber">

<button onclick="startTracking()">Track</button>

<div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const supabaseClient = window.supabaseClient;

let currentOrderNumber=null;


/* AUTO LOAD */
function autoLoad(){

const params = new URLSearchParams(window.location.search);

const number = params.get("order_number");

if(number){

currentOrderNumber=parseInt(number);

orderNumber.value=number;

loadOrder();

}

}

autoLoad();


async function startTracking(){

currentOrderNumber=parseInt(orderNumber.value);

loadOrder();

}


async function loadOrder(){

if(!currentOrderNumber)return;

const { data } =
await supabaseClient
.from("orders")
.select("*")
.eq("order_number",currentOrderNumber)
.single();


const { data: serving } =
await supabaseClient
.from("orders")
.select("order_number")
.neq("status","Completed")
.order("order_number",{ascending:true})
.limit(1);


let currentlyServing=serving[0].order_number;

let peopleAhead=currentOrderNumber-currentlyServing;

if(peopleAhead<0)peopleAhead=0;


result.innerHTML=`

Currently Serving: #${currentlyServing}<br>
Your Number: #${currentOrderNumber}<br>
People Ahead: ${peopleAhead}<br>
Status: ${data.status}

`;

}


setInterval(loadOrder,3000);

</script>

</body>
</html>
