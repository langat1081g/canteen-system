<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track My Order</title>

<style>

body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
z-index: 1000;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.cart-count{
background:red;
color:white;
border-radius:50%;
padding:3px 8px;
font-size:12px;
margin-left:5px;
}

.main{
margin-top:80px;
}

header{
background:#28a745;
color:white;
text-align:center;
padding:15px;
font-size:24px;
}

.container{
background:white;
width:90%;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.result{
margin-top:20px;
font-size:18px;
}

.ready{
color:green;
font-weight:bold;
}

.wait{
color:orange;
font-weight:bold;
}

.item{
background:#f1f1f1;
padding:8px;
margin-top:5px;
border-radius:5px;
}

</style>
</head>
<body>

<div class="navbar">

<a href="menu.html">Menu</a>

<a href="cart.html">
Cart <span class="cart-count" id="cartCount">0</span>
</a>

<a href="orders.html">My Order</a>

<a href="track.html">Track Order</a>

<a href="#" onclick="logout()">Logout</a>

</div>

<div class="main">

<header>Track My Order</header>

<div class="container">

<div class="result" id="result">
Loading your order...
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://hbofboaoixzxqzouncyj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* UPDATE CART COUNT */
let cart =
JSON.parse(localStorage.getItem("cart")) || [];

document.getElementById("cartCount").innerText =
cart.length;

/* LOAD USER ORDER */
async function trackOrder(){

/* GET AUTH USER */
let { data:{ user } } =
await supabase.auth.getUser();

if(!user){

window.location.href="auth.html";
return;

}

/* GET USER ORDER */
let { data, error } =
await supabase
.from("orders")
.select("*")
.eq("user_id", user.id)
.order("order_number",{ascending:false})
.limit(1);

if(!data || data.length===0){

document.getElementById("result").innerHTML =
"No order found";

return;

}

let order = data[0];

/* GET QUEUE POSITION */
let { data: queue } =
await supabase
.from("orders")
.select("order_number")
.lte("order_number",order.order_number);

let position =
queue.length - 1;

let waitTime =
position * 2;

let status =
position===0?"READY":"WAITING";

let items =
JSON.parse(order.items);

let itemsHTML="";

items.forEach(item=>{

itemsHTML+=`
<div class="item">
${item.name} - Ksh ${item.price}
</div>`;

});

document.getElementById("result").innerHTML = `

<p><strong>Your Queue Number:</strong>
${order.order_number}</p>

<p><strong>Students ahead:</strong>
${position}</p>

<p><strong>Estimated wait:</strong>
${waitTime} minutes</p>

<p class="${
status==="READY"?"ready":"wait"
}">
Status: ${status}
</p>

<p><strong>Your Items:</strong></p>

${itemsHTML}

`;

}

/* AUTO REFRESH */
setInterval(trackOrder,5000);

trackOrder();

/* LOGOUT */
async function logout(){

await supabase.auth.signOut();

window.location.href="auth.html";

}

</script>

</body>
</html>
