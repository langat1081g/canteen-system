<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
padding:20px;
}

.order{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

button{
margin:5px;
padding:8px;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

.pay{background:green;}
.prep{background:orange;}
.ready{background:blue;}
.complete{background:black;}

.logout{
background:red;
float:right;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

</style>

</head>
<body>

<div class="header">
<h2>Admin Dashboard</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div id="orders">Loading orders...</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* CHANGE THIS TO YOUR ADMIN EMAIL */
const ADMIN_EMAIL = "langat3080g@gmail.com";


const client =
window.supabase.createClient(
"https://hbofboaoixzxqzouncyj.supabase.co",
"sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I"
);

let currentAdmin = null;


/* RELIABLE ADMIN PROTECTION */
async function protectAdmin(){

const { data, error } =
await client.auth.getSession();

if(error || !data.session){

alert("Please login first");
window.location.href="auth.html";
return;

}

const user = data.session.user;

/* CHECK ADMIN EMAIL */
if(user.email !== ADMIN_EMAIL){

alert("Access denied. Admin only.");
window.location.href="menu.html";
return;

}

currentAdmin = user;

loadOrders();

}

protectAdmin();



/* LOAD ORDERS */
async function loadOrders(){

let { data, error } =
await client
.from("orders")
.select("*")
.order("order_number",{ascending:false});

if(error){

document.getElementById("orders").innerHTML =
"Error loading orders";
return;

}

if(data.length === 0){

document.getElementById("orders").innerHTML =
"No orders found";
return;

}

let html="";

data.forEach(order=>{

let payment =
order.payment_status || "Pending";

let status =
order.status || "Waiting";

html += `

<div class="order">

<b>Order #${order.order_number}</b><br><br>

User ID: ${order.user_id}<br>
Payment: <b>${payment}</b><br>
Status: <b>${status}</b><br><br>

<button class="pay"
onclick="approvePayment('${order.id}')">
Approve Payment
</button>

<button class="prep"
onclick="updateStatus('${order.id}','Preparing')">
Preparing
</button>

<button class="ready"
onclick="updateStatus('${order.id}','Ready')">
Ready
</button>

<button class="complete"
onclick="updateStatus('${order.id}','Completed')">
Completed
</button>

</div>

`;

});

document.getElementById("orders").innerHTML = html;

}



/* APPROVE PAYMENT */
async function approvePayment(id){

const { error } =
await client
.from("orders")
.update({
payment_status:"Paid",
status:"Preparing"
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

loadOrders();

}



/* UPDATE STATUS */
async function updateStatus(id,status){

const { error } =
await client
.from("orders")
.update({
status:status
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

loadOrders();

}



/* LOGOUT */
async function logout(){

await client.auth.signOut();

window.location.href="auth.html";

}

</script>

</body>
</html>
