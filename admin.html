<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Segoe UI',Arial,sans-serif;
background:#eef2f7;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:#1f2937;
padding:12px 8px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
z-index:1000;
}

.navbar a{
color:white;
text-decoration:none;
padding:8px 12px;
border-radius:6px;
font-size:14px;
transition:0.2s;
}

.navbar a:hover{
background:#374151;
}

/* MAIN CONTAINER */
.main{
max-width:700px;
margin:90px auto 20px auto;
padding:15px;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
flex-wrap:wrap;
gap:10px;
}

.header h2{
color:#111827;
}

/* LOGOUT BUTTON */
.logout{
background:#dc2626;
color:white;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

/* SERVING BOX */
.serving{
background:linear-gradient(135deg,#3b82f6,#2563eb);
color:white;
padding:12px;
border-radius:10px;
margin-bottom:15px;
font-weight:600;
text-align:center;
}

/* ORDER CARD */
.order{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

/* ORDER TITLE */
.order b{
font-size:16px;
color:#111827;
}

/* BUTTON CONTAINER */
.actions{
margin-top:10px;
display:flex;
flex-wrap:wrap;
gap:8px;
}

/* BUTTONS */
button{
flex:1;
min-width:120px;
padding:10px;
border:none;
color:white;
cursor:pointer;
border-radius:8px;
font-weight:600;
font-size:14px;
}

.pay{background:#16a34a;}
.prep{background:#f59e0b;}
.ready{background:#2563eb;}
.complete{background:#111827;}

button:hover{
opacity:0.9;
}

/* MOBILE FIX */
@media(max-width:480px){

.main{
padding:10px;
}

.header{
flex-direction:column;
align-items:flex-start;
}

button{
font-size:13px;
padding:9px;
}

}

</style>

</head>
<body>

<div class="navbar">
<a href="index.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Orders</a>
<a href="track.html">Track Order</a>
<a href="admin.html">Admin</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

<div class="header">
<h2>Admin Dashboard</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div id="currentlyServing" class="serving">
Loading currently serving...
</div>

<div id="orders">Loading orders...</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

/* CHANGE THIS TO YOUR ADMIN EMAIL */
const ADMIN_EMAIL = "langat3080@gmail.com";

/* USE SHARED CLIENT */
const client = window.supabaseClient;

let currentAdmin = null;


/* ADMIN PROTECTION */
async function protectAdmin(){

const { data, error } =
await client.auth.getSession();

if(error || !data.session){

alert("Please login first");
window.location.href="index.html";
return;

}

const user = data.session.user;

if(user.email !== ADMIN_EMAIL){

alert("Access denied. Admin only.");
window.location.href="menu.html";
return;

}

currentAdmin = user;

loadOrders();
loadCurrentlyServing();

}

protectAdmin();


/* LOAD CURRENTLY SERVING */
async function loadCurrentlyServing(){

let { data } =
await client
.from("orders")
.select("order_number,status")
.neq("status","Completed")
.order("order_number",{ascending:true})
.limit(1);

let servingText =
(data && data.length > 0)
? "Currently Serving: Order #" + data[0].order_number
: "No active orders";

document.getElementById("currentlyServing").innerHTML =
servingText;

}


/* LOAD ORDERS */
async function loadOrders(){

let { data, error } =
await client
.from("orders")
.select("*")
.order("order_number",{ascending:false});

if(error){

document.getElementById("orders").innerHTML =
"Error loading orders";
return;

}

if(data.length === 0){

document.getElementById("orders").innerHTML =
"No orders found";
return;

}

let html="";

data.forEach(order=>{

let payment =
order.payment_status || "Pending";

let status =
order.status || "Waiting";

html += `

<div class="order">

<b>Order #${order.order_number}</b><br><br>

User ID: ${order.user_id}<br>
Payment: <b>${payment}</b><br>
Status: <b>${status}</b>

<div class="actions">

<button class="pay"
onclick="approvePayment('${order.id}')">
Approve Payment
</button>

<button class="prep"
onclick="updateStatus('${order.id}','Preparing')">
Preparing
</button>

<button class="ready"
onclick="updateStatus('${order.id}','Ready')">
Ready
</button>

<button class="complete"
onclick="updateStatus('${order.id}','Completed')">
Completed
</button>

</div>

</div>

`;

});

document.getElementById("orders").innerHTML = html;

}


/* APPROVE PAYMENT */
async function approvePayment(id){

const { error } =
await client
.from("orders")
.update({
payment_status:"Paid",
status:"Preparing"
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

refreshAll();

}


/* UPDATE STATUS */
async function updateStatus(id,status){

const { error } =
await client
.from("orders")
.update({
status:status
})
.eq("id",id);

if(error){

alert(error.message);
return;

}

refreshAll();

}


/* REFRESH EVERYTHING */
function refreshAll(){

loadOrders();
loadCurrentlyServing();

}


/* REALTIME AUTO UPDATE */
client
.channel("admin-orders-realtime")
.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"orders"
},
()=>{
refreshAll();
}
)
.subscribe();


/* LOGOUT */
async function logout(){

await client.auth.signOut();

window.location.href="index.html";

}

</script>

</body>
</html>
