<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<style>
/* ... your CSS stays the same ... */
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Menu</a>
<a href="cart.html">Cart <span id="cartCount" class="cart-count">0</span></a>
<a href="orders.html">My Order</a>
<a href="track.html">Track Order</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">
<div class="container">

<h3>Order Summary</h3>

<div id="msgBox"></div>
<div id="orderSummary"></div>

<form id="checkoutForm">
<input type="text" id="name" placeholder="Student Name" required>
<input type="text" id="phone" placeholder="Phone Number" required>
<label for="time">Pickup Time</label>
<input type="time" id="time" required>

<select id="payment" required>
<option value="">Payment Method</option>
<option value="Mpesa">Mpesa</option>
</select>

<button type="submit" id="payBtn">Proceed to Payment</button>
</form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const supabaseClient = window.supabaseClient;
let currentUser = null;
let cart = [];

const msgBox = document.getElementById("msgBox");
function showMessage(message,type){ msgBox.innerHTML = message; msgBox.className = type; }

async function init(){
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(!session){
    localStorage.setItem("cartData", JSON.stringify(cart));
    window.location.href = "login.html?redirect=checkout";
    return;
  }
  currentUser = session.user;
  let savedCart = localStorage.getItem("cartData");
  if(savedCart) cart = JSON.parse(savedCart);
  displaySummary();
}

init();

function displaySummary(){
  let total = 0, html = "";
  cart.forEach(item=>{
    let itemTotal = item.price*item.quantity;
    total+=itemTotal;
    html += `<p>${item.item_name} - Ksh ${item.price} x ${item.quantity}</p>`;
  });
  html += `<hr><strong>Total: Ksh ${total}</strong>`;
  document.getElementById("orderSummary").innerHTML = html;
}

document.getElementById("checkoutForm").addEventListener("submit", async function(e){
  e.preventDefault();
  if(payment.value!=="Mpesa"){ showMessage("Please select Mpesa to proceed","error"); return; }

  const btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  // ✅ Reduce stock safely for each item
  for(let item of cart){
    const { data: menuItem, error: menuError } = await supabaseClient
      .from("menu")
      .select("quantity")
      .eq("item_name", item.item_name)
      .single();

    if(menuError || !menuItem){
      showMessage("Failed to update stock for " + item.item_name,"error");
      btn.disabled=false; btn.innerText="Proceed to Payment"; return;
    }

    // Ensure quantity is a number
    const currentQty = Number(menuItem.quantity);
    if(currentQty < item.quantity){
      showMessage("Not enough stock for " + item.item_name,"error");
      btn.disabled=false; btn.innerText="Proceed to Payment"; return;
    }

    const { error: updateError } = await supabaseClient
      .from("menu")
      .update({ quantity: currentQty - item.quantity })
      .eq("item_name", item.item_name);

    if(updateError){
      showMessage("Failed to update stock for " + item.item_name,"error");
      btn.disabled=false; btn.innerText="Proceed to Payment"; return;
    }
  }

  // Insert order
  const { data: orderData, error: orderError } = await supabaseClient
    .from("orders")
    .insert([{
      user_id: currentUser.id,
      student_name: name.value,
      phone: phone.value,
      pickup_time: time.value,
      payment_method: payment.value,
      items: JSON.stringify(cart),
      status:"Waiting",
      payment_status:"Pending"
    }])
    .select("id, order_number")
    .single();

  if(orderError){
    showMessage(orderError.message,"error");
    btn.disabled=false; btn.innerText="Proceed to Payment";
    return;
  }

  // Clear cart
  await supabaseClient.from("cart").delete().eq("user_id", currentUser.id);
  localStorage.removeItem("cartData");

  showMessage("Order placed! Queue Number: #" + orderData.order_number,"success");

  setTimeout(()=>{
    window.location.href = "payment.html?order_id="+orderData.id+"&order_number="+orderData.order_number;
  },2000);
});

async function logout(){
  await supabaseClient.auth.signOut();
  window.location.href="index.html";
}
</script>
</body>
</html>
