<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.cart-count{
background:red;
color:white;
border-radius:50%;
padding:3px 8px;
font-size:12px;
}

.main{
margin-top:80px;
}

.container{
background:white;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

input, select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:green;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
font-size:16px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="menu.html">Menu</a>
<a href="cart.html">Cart <span id="cartCount" class="cart-count">0</span></a>
<a href="orders.html">My Order</a>
<a href="track.html">Track Order</a>
<a href="admin.html">Admin</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">
<div class="container">

<h3>Order Summary</h3>
<div id="orderSummary"></div>

<form id="checkoutForm">

<input type="text" id="name" placeholder="Student Name" required>

<input type="text" id="phone" placeholder="Phone Number" required>

<input type="time" id="time" required>

<select id="payment" required>
<option value="">Payment Method</option>
<option value="Mpesa">Mpesa</option>
<option value="Cash">Cash</option>
</select>

<button type="submit" id="payBtn">
Continue to Payment
</button>

</form>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* CREATE CLIENT ONCE */
const supabase = window.supabase.createClient(
"https://hbofboaoixzxqzouncyj.supabase.co",
"sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I"
);

let currentUser = null;
let cart = [];


/* WAIT FOR PAGE LOAD — CRITICAL FIX */
window.addEventListener("DOMContentLoaded", () => {

document
.getElementById("checkoutForm")
.addEventListener("submit", placeOrder);

init();

});


/* INIT SESSION */
async function init(){

const { data:{ session }, error } =
await supabase.auth.getSession();

if(error || !session){

window.location.href="auth.html";
return;

}

currentUser = session.user;

loadCart();

}


/* LOAD CART */
async function loadCart(){

const { data, error } =
await supabase
.from("cart")
.select("*")
.eq("user_id", currentUser.id);

if(error){

alert(error.message);
return;

}

cart = data;

document.getElementById("cartCount").innerText =
cart.length;

displaySummary();

}


/* DISPLAY SUMMARY */
function displaySummary(){

const summary =
document.getElementById("orderSummary");

if(cart.length === 0){

summary.innerHTML = "Cart empty";
return;

}

let total = 0;
let html = "";

cart.forEach(item=>{

total += item.price;

html += `<p>${item.item_name} - Ksh ${item.price}</p>`;

});

html += `<hr><strong>Total: Ksh ${total}</strong>`;

summary.innerHTML = html;

}


/* PLACE ORDER — REFRESH SAFE */
async function placeOrder(event){

event.preventDefault();
event.stopPropagation();

const btn =
document.getElementById("payBtn");

btn.disabled = true;
btn.innerText = "Processing...";

if(cart.length === 0){

alert("Cart empty");

btn.disabled=false;
btn.innerText="Continue to Payment";

return;

}

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

const time =
document.getElementById("time").value;

const payment =
document.getElementById("payment").value;


const { data, error } =
await supabase
.from("orders")
.insert([{

user_id: currentUser.id,
student_name: name,
phone: phone,
pickup_time: time,
payment_method: payment,
items: JSON.stringify(cart),
status:"Waiting",
payment_status:"Pending"

}])
.select()
.single();


if(error){

alert(error.message);

btn.disabled=false;
btn.innerText="Continue to Payment";

return;

}


/* CLEAR CART */
await supabase
.from("cart")
.delete()
.eq("user_id", currentUser.id);


/* REDIRECT */
window.location.href =
"payment.html?order_id=" + data.id;

}


/* LOGOUT */
async function logout(){

await supabase.auth.signOut();

window.location.href="auth.html";

}

</script>

</body>
</html>
