<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>

body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
z-index: 1000;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.cart-count{
background:red;
color:white;
border-radius:50%;
padding:3px 8px;
font-size:12px;
margin-left:5px;
}

.main{
margin-top:80px;
}

header{
background:#007bff;
color:white;
text-align:center;
padding:15px;
font-size:24px;
}

.container{
background:white;
width:90%;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

input, select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:green;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

.summary{
background:#f1f1f1;
padding:10px;
border-radius:5px;
margin-top:10px;
}

</style>
</head>
<body>

<div class="navbar">

<a href="menu.html">Menu</a>

<a href="cart.html">
Cart <span class="cart-count" id="cartCount">0</span>
</a>

<a href="orders.html">My Order</a>

<a href="track.html">Track Order</a>

<a href="#" onclick="logout()">Logout</a>

</div>

<div class="main">

<header>Checkout</header>

<div class="container">

<h3>Order Summary</h3>

<div id="orderSummary" class="summary"></div>

<form onsubmit="placeOrder(event)">

<input type="text" id="name" placeholder="Student Name" required>

<input type="text" id="phone" placeholder="Phone Number" required>

<input type="time" id="time" required>

<select id="payment" required>

<option value="">Payment Method</option>
<option value="Mpesa">Mpesa</option>
<option value="Cash">Cash</option>

</select>

<button type="submit">Place Order</button>

</form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = window.supabase.createClient(
"https://hbofboaoixzxqzouncyj.supabase.co",
"sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I"
);

let currentUser = null;
let cart = [];


/* AUTH SESSION */
client.auth.onAuthStateChange(async (event, session) => {

if(!session){

window.location.href="auth.html";
return;

}

currentUser = session.user;

loadCart();

});


/* LOAD CART */
async function loadCart(){

const { data, error } =
await client
.from("cart")
.select("*")
.eq("user_id", currentUser.id)
.order("created_at",{ascending:true});

if(error){

alert("Error loading cart");
return;

}

cart = data;

updateCartCount();
displaySummary();

}


/* UPDATE COUNT */
function updateCartCount(){

document.getElementById("cartCount").innerText =
cart.length;

}


/* DISPLAY SUMMARY */
function displaySummary(){

let summary =
document.getElementById("orderSummary");

if(cart.length===0){

summary.innerHTML="No items in cart";
return;

}

let total=0;
let html="";

cart.forEach(item=>{

total+=item.price;

html+=`
<p>${item.item_name} - Ksh ${item.price}</p>
`;

});

html+=`<hr><strong>Total: Ksh ${total}</strong>`;

summary.innerHTML=html;

}


/* PLACE ORDER (FIXED — NO DUPLICATES EVER) */
async function placeOrder(event){

event.preventDefault();

if(cart.length===0){

alert("Cart empty");
return;

}

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

const time =
document.getElementById("time").value;

const payment =
document.getElementById("payment").value;


/* INSERT WITHOUT order_number */
/* Supabase auto-generates order_number */
let { data, error } =
await client
.from("orders")
.insert([{

user_id: currentUser.id,

student_name: name,

phone: phone,

pickup_time: time,

payment_method: payment,

items: JSON.stringify(cart),

status: "Waiting",

payment_status: "Pending"

}])
.select()
.single();


if(error){

alert(error.message);
return;

}


/* CLEAR CART */
await client
.from("cart")
.delete()
.eq("user_id", currentUser.id);


alert(
"Order placed successfully!\nQueue Number: "
+ data.order_number
);


window.location.href="orders.html";

}


/* LOGOUT */
async function logout(){

await client.auth.signOut();

window.location.href="auth.html";

}

</script>

</body>
</html>
