<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Segoe UI',Arial,sans-serif; background:linear-gradient(135deg,#eef2f7,#e3e8ee); min-height:100vh; }

.navbar{ position:fixed; top:0; left:0; width:100%; background:#1f2937; padding:12px; display:flex; justify-content:center; gap:10px; }
.navbar a{ color:white; text-decoration:none; padding:8px 12px; border-radius:6px; }
.navbar a:hover{ background:#374151; }

.main{ margin-top:90px; padding:15px; }

.container{ background:white; max-width:420px; margin:auto; padding:25px; border-radius:14px; }

input, select{ width:100%; padding:12px; margin-top:10px; border-radius:8px; border:1px solid #ccc; }

button{ width:100%; padding:14px; margin-top:15px; background:#16a34a; color:white; border:none; border-radius:8px; cursor:pointer; }
button:disabled{ background:gray; }

#msgBox{ text-align:center; margin-bottom:10px; font-weight:bold; }
.success{ color:green; }
.error{ color:red; }
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Order</a>
</div>

<div class="main">
<div class="container">

<h3>Order Summary</h3>

<div id="msgBox"></div>
<div id="orderSummary"></div>

<form id="checkoutForm">
<input type="text" id="name" placeholder="Student Name" required>
<input type="text" id="phone" placeholder="2547XXXXXXXX" required>
<input type="time" id="time" required>

<select id="payment" required>
<option value="">Payment Method</option>
<option value="Mpesa">Mpesa</option>
</select>

<button type="submit" id="payBtn">Pay Now</button>
</form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const supabaseClient = window.supabaseClient;
let currentUser = null;
let cart = [];

const msgBox = document.getElementById("msgBox");

function showMessage(message,type){
  msgBox.innerHTML = message;
  msgBox.className = type;
}

/* INIT */
async function init(){
  const { data:{ session } } = await supabaseClient.auth.getSession();

  if(!session){
    window.location.href = "login.html";
    return;
  }

  currentUser = session.user;

  let savedCart = localStorage.getItem("cartData");
  if(savedCart){
    cart = JSON.parse(savedCart);
  }

  displaySummary();
}
init();

/* DISPLAY */
function displaySummary(){
  let total = 0;
  let html = "";

  cart.forEach(item=>{
    let t = item.price * item.quantity;
    total += t;
    html += `<p>${item.item_name} - Ksh ${item.price} x ${item.quantity}</p>`;
  });

  html += `<hr><strong>Total: Ksh ${total}</strong>`;
  document.getElementById("orderSummary").innerHTML = html;
}

/* SUBMIT */
document.getElementById("checkoutForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  const totalAmount = cart.reduce((t,i)=> t + i.price*i.quantity,0);

  try{

    // ✅ SAVE ORDER
    const { data: orderData, error } = await supabaseClient
      .from("orders")
      .insert([{
        user_id: currentUser.id,
        student_name: name.value,
        phone: phone.value,
        pickup_time: time.value,
        payment_method: "Mpesa",
        items: JSON.stringify(cart),
        status:"Waiting",
        payment_status:"Pending"
      }])
      .select("id, order_number")
      .single();

    if(error){
      throw error;
    }

    // ✅ CALL M-PESA
    showMessage("Sending payment request...", "success");
    btn.innerText = "Sending STK...";

    const response = await fetch("https://canteen-system-backend.onrender.com/stkpush", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        phone: phone.value,
        amount: totalAmount,
        order_id: orderData.id
      })
    });

    const data = await response.json();
    console.log(data);

    btn.innerText = "Waiting for payment...";
    showMessage("📲 Check your phone and enter M-Pesa PIN", "success");

    // ✅ CLEAR CART
    localStorage.removeItem("cartData");

    // ✅ REDIRECT
    setTimeout(()=>{
      window.location.href = "track.html?order_number=" + orderData.number;
    },4000);

  }catch(err){
    console.error(err);
    showMessage("Something went wrong ❌", "error");
    btn.disabled = false;
    btn.innerText = "Pay Now";
  }

});
</script>

</body>
</html>
