<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.cart-count{
background:red;
color:white;
border-radius:50%;
padding:3px 8px;
font-size:12px;
}

.main{
margin-top:80px;
}

.container{
background:white;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:green;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

button:disabled{
background:gray;
}

/* MESSAGE BOX */
#msgBox{
text-align:center;
margin-top:10px;
font-weight:bold;
}

.success{
color:green;
}

.error{
color:red;
}

</style>
</head>

<body>

<div class="navbar">
<a href="menu.html">Menu</a>
<a href="cart.html">Cart <span id="cartCount" class="cart-count">0</span></a>
<a href="orders.html">My Order</a>
<a href="track.html">Track Order</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">
<div class="container">

<h3>Order Summary</h3>

<div id="msgBox"></div>

<div id="orderSummary"></div>

<form id="checkoutForm">

<input type="text" id="name" placeholder="Student Name" required>
<input type="text" id="phone" placeholder="Phone Number" required>
<input type="time" id="time" required>

<select id="payment" required>
<option value="">Payment Method</option>
<option value="Mpesa">Mpesa</option>
</select>

<button type="submit" id="payBtn">
Make Payment
</button>

</form>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const supabaseClient = window.supabaseClient;

let currentUser = null;
let cart = [];

const msgBox =
document.getElementById("msgBox");


/* MESSAGE FUNCTION */
function showMessage(message,type){

msgBox.innerHTML=message;
msgBox.className=type;

}


/* INIT */
async function init(){

const { data:{ session } } =
await supabaseClient.auth.getSession();

if(!session){

window.location.href="index.html";
return;

}

currentUser = session.user;

loadCart();

}

init();


document
.getElementById("checkoutForm")
.addEventListener("submit", placeOrder);


/* LOAD CART */
async function loadCart(){

const { data, error } =
await supabaseClient
.from("cart")
.select("*")
.eq("user_id", currentUser.id);

if(error){

showMessage(error.message,"error");
return;

}

cart = data;

document.getElementById("cartCount").innerText =
cart.length;

displaySummary();

}


/* DISPLAY SUMMARY */
function displaySummary(){

let total = 0;
let html = "";

cart.forEach(item=>{

total += item.price;

html += `<p>${item.item_name} - Ksh ${item.price}</p>`;

});

html += `<hr><strong>Total: Ksh ${total}</strong>`;

document.getElementById("orderSummary").innerHTML = html;

}


/* PLACE ORDER */
async function placeOrder(event){

event.preventDefault();

const btn =
document.getElementById("payBtn");

btn.disabled = true;
btn.innerText = "Processing...";


const { data, error } =
await supabaseClient
.from("orders")
.insert([{

user_id: currentUser.id,
student_name: name.value,
phone: phone.value,
pickup_time: time.value,
payment_method: payment.value,
items: JSON.stringify(cart),
status:"Waiting",
payment_status:"Pending"

}])
.select("id, order_number")
.single();


if(error){

showMessage(error.message,"error");

btn.disabled=false;
btn.innerText="Make Payment";

return;

}


/* SHOW QUEUE NUMBER */
showMessage(
"Order placed successfully! Your Queue Number is #" +
data.order_number,
"success"
);


/* CLEAR CART */
await supabaseClient
.from("cart")
.delete()
.eq("user_id", currentUser.id);


/* REDIRECT AFTER 2 SECONDS */
setTimeout(()=>{

window.location.href =
"payment.html?order_id=" + data.id +
"&order_number=" + data.order_number;

},2000);

}


/* LOGOUT */
async function logout(){

await supabaseClient.auth.signOut();

window.location.href="index.html";

}

</script>

</body>
</html>
