<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart</title>

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:#eef2f7;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:#1f2937;
padding:12px 10px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
z-index:1000;
}

.navbar a{
color:white;
text-decoration:none;
font-weight:bold;
padding:8px 12px;
border-radius:6px;
font-size:14px;
transition:0.2s;
}

.navbar a:hover{
background:#374151;
}

.cart-count{
background:#ef4444;
color:white;
border-radius:50%;
padding:2px 7px;
font-size:12px;
margin-left:4px;
}

/* MAIN */
.main{
margin-top:70px;
}

/* HEADER */
header{
background:linear-gradient(135deg,#007bff,#00c6ff);
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

/* MESSAGE BOX */
#msgBox{
text-align:center;
margin-top:10px;
font-weight:bold;
min-height:20px;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

/* CONTAINER */
.container{
padding:15px;
max-width:700px;
margin:auto;
}

/* CART ITEM */
.cart-item{
background:white;
padding:16px;
margin-bottom:12px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
transition:0.2s;
}

.cart-item:hover{
transform:translateY(-2px);
box-shadow:0 6px 18px rgba(0,0,0,0.12);
}

.cart-item h3{
margin-bottom:6px;
color:#111827;
}

.cart-item p{
margin-bottom:10px;
color:#374151;
font-weight:bold;
}

/* REMOVE BUTTON */
.remove-btn{
background:#ef4444;
color:white;
border:none;
padding:8px 14px;
cursor:pointer;
border-radius:6px;
font-weight:bold;
}

.remove-btn:hover{
background:#dc2626;
}

/* TOTAL */
.total{
font-size:20px;
font-weight:bold;
margin-top:15px;
text-align:center;
color:#111827;
}

/* CHECKOUT BUTTON */
.checkout-btn{
background:#16a34a;
margin-top:20px;
padding:14px;
width:100%;
color:white;
border:none;
cursor:pointer;
border-radius:10px;
font-size:16px;
font-weight:bold;
transition:0.2s;
}

.checkout-btn:hover{
background:#15803d;
}

/* EMPTY */
.empty{
text-align:center;
font-size:18px;
color:#6b7280;
margin-top:30px;
}

/* MOBILE FIX */
@media(max-width:480px){

.navbar{
gap:5px;
padding:10px 5px;
}

.navbar a{
font-size:13px;
padding:6px 8px;
}

header{
font-size:20px;
padding:15px;
}

.container{
padding:12px;
}

.cart-item{
padding:14px;
}

}

</style>
</head>
<body>

<div class="navbar">

<a href="menu.html">Menu</a>

<a href="cart.html">
Cart <span class="cart-count" id="cartCount">0</span>
</a>

<a href="orders.html">My Order</a>

<a href="track.html">Track Order</a>

<a href="#" onclick="logout()">Logout</a>

</div>

<div class="main">

<header>Your Cart</header>

<div id="msgBox"></div>

<div class="container">

<div id="cartList"></div>

<div class="total" id="totalPrice"></div>

<button class="checkout-btn" onclick="checkout()">
Proceed to Checkout
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const client = window.supabaseClient;

let currentUser = null;
let cart = [];

const msgBox =
document.getElementById("msgBox");


function showMessage(message,type){

msgBox.innerHTML=message;
msgBox.className=type;

setTimeout(()=>{
msgBox.innerHTML="";
},3000);

}

client.auth.onAuthStateChange(async (event, session) => {

if(!session){

window.location.href="index.html";
return;

}

currentUser = session.user;

loadCart();

});

async function loadCart(){

const { data, error } =
await client
.from("cart")
.select("*")
.eq("user_id", currentUser.id)
.order("created_at",{ascending:true});

if(error){

showMessage("Error loading cart","error");
return;

}

cart = data;

updateCartCount();
displayCart();

}

function updateCartCount(){

document.getElementById("cartCount").innerText =
cart.length;

}

function displayCart(){

let cartList =
document.getElementById("cartList");

let total = 0;

cartList.innerHTML = "";

if(cart.length === 0){

cartList.innerHTML =
"<div class='empty'>Your cart is empty</div>";

document.getElementById("totalPrice").innerText = "";

return;

}

cart.forEach(item=>{

total += item.price;

cartList.innerHTML += `

<div class="cart-item">

<h3>${item.item_name}</h3>

<p>Price: Ksh ${item.price}</p>

<button class="remove-btn"
onclick="removeItem('${item.id}')">

Remove

</button>

</div>

`;

});

document.getElementById("totalPrice").innerText =
"Total: Ksh " + total;

}

async function removeItem(id){

const { error } =
await client
.from("cart")
.delete()
.eq("id", id);

if(error){

showMessage("Error removing item","error");
return;

}

showMessage("Item removed","success");

loadCart();

}

function checkout(){

if(cart.length === 0){

showMessage("Your cart is empty","error");
return;

}

window.location.href="checkout.html";

}

async function logout(){

await client.auth.signOut();

window.location.href="index.html";

}

</script>

</body>
</html>
