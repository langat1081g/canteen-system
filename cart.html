<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>

<style>
body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

/* NAV */
.navbar{
background:#1f2937;
padding:12px;
display:flex;
justify-content:center;
gap:10px;
}

.navbar a{
color:white;
text-decoration:none;
font-weight:bold;
}

.cart-count{
background:red;
border-radius:50%;
padding:2px 7px;
font-size:12px;
}

/* MAIN */
.container{
max-width:600px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* ITEM */
.cart-item{
border-bottom:1px solid #ddd;
padding:10px 0;
}

button{
padding:8px;
border:none;
border-radius:5px;
cursor:pointer;
}

.remove-btn{
background:red;
color:white;
}

.checkout-btn{
background:green;
color:white;
width:100%;
padding:12px;
margin-top:20px;
}

/* MESSAGE */
#msgBox{
text-align:center;
font-weight:bold;
margin-top:10px;
}

.success{color:green;}
.error{color:red;}

.empty{
text-align:center;
padding:20px;
}

</style>
</head>
<body>

<div class="navbar">
<a href="menu.html">Menu</a>
<a href="cart.html">Cart <span id="cartCount" class="cart-count">0</span></a>
<a href="orders.html">Orders</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="container">

<h2>Your Cart</h2>

<div id="msgBox"></div>

<div id="cartList"></div>

<h3 id="totalPrice"></h3>

<button class="checkout-btn" onclick="checkout()">
Proceed to Checkout
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>



<script>

const client = window.supabaseClient;

let currentUser = null;
let cart = [];

const msgBox = document.getElementById("msgBox");

function showMessage(message,type){
msgBox.innerHTML = message;
msgBox.className = type;
setTimeout(()=>{msgBox.innerHTML="";},3000);
}

/* ========================= */
/* 🔥 INIT (NO FORCE LOGIN) */
/* ========================= */

async function init(){

const { data:{ session } } =
await client.auth.getSession();

if(session){
currentUser = session.user;
}

loadCart();

}

init();

/* ========================= */
/* 🛒 LOAD CART */
/* ========================= */

async function loadCart(){

/* LOGGED USER */
if(currentUser){

const { data, error } =
await client
.from("cart")
.select("*")
.eq("user_id", currentUser.id);

if(error){
showMessage("Error loading cart","error");
return;
}

processCart(data);

}

/* GUEST USER */
else{

let guestCart =
JSON.parse(localStorage.getItem("guestCart")) || [];

processCart(guestCart);

}

}

/* ========================= */
/* 🔥 GROUP ITEMS */
/* ========================= */

function processCart(data){

let grouped = {};

data.forEach(item=>{

let name = item.item_name;

if(grouped[name]){
grouped[name].quantity += 1;
}else{
grouped[name] = {
item_name: name,
price: item.price,
quantity: 1
};
}

});

cart = Object.values(grouped);

updateCartCount(data.length);
displayCart();

}

/* ========================= */
/* 🔢 CART COUNT */
/* ========================= */

function updateCartCount(count){
document.getElementById("cartCount").innerText = count;
}

/* ========================= */
/* DISPLAY */
/* ========================= */

function displayCart(){

let cartList = document.getElementById("cartList");
let total = 0;

cartList.innerHTML = "";

if(cart.length === 0){

cartList.innerHTML =
"<div class='empty'>Your cart is empty</div>";

document.getElementById("totalPrice").innerText = "";
return;

}

cart.forEach(item=>{

let itemTotal = item.price * item.quantity;
total += itemTotal;

cartList.innerHTML += `

<div class="cart-item">

<h3>${item.item_name}</h3>

<p>Ksh ${item.price} x ${item.quantity}</p>

<div style="display:flex;gap:10px;margin-bottom:10px;">
<button onclick="decreaseQty('${item.item_name}')">-</button>
<button onclick="increaseQty('${item.item_name}')">+</button>
</div>

<p><b>Total: Ksh ${itemTotal}</b></p>

<button class="remove-btn"
onclick="removeAll('${item.item_name}')">
Remove
</button>

</div>

`;

});

document.getElementById("totalPrice").innerText =
"Total: Ksh " + total;

}

/* ========================= */
/* ➕ INCREASE */
/* ========================= */

async function increaseQty(name){

// STOCK CHECK
const { data: stockData } = await client
.from("menu")
.select("quantity")
.eq("item_name",name)
.single();

let currentQty =
cart.find(i=>i.item_name===name).quantity;

if(currentQty >= stockData.quantity){
showMessage("Max stock reached","error");
return;
}

/* LOGGED USER */
if(currentUser){

await client.from("cart").insert([{
user_id: currentUser.id,
item_name: name,
price: cart.find(i=>i.item_name===name).price
}]);

}

/* GUEST USER */
else{

let guestCart =
JSON.parse(localStorage.getItem("guestCart")) || [];

guestCart.push({
item_name: name,
price: cart.find(i=>i.item_name===name).price
});

localStorage.setItem("guestCart", JSON.stringify(guestCart));

}

loadCart();

}

/* ========================= */
/* ➖ DECREASE */
/* ========================= */

async function decreaseQty(name){

/* LOGGED USER */
if(currentUser){

const { data } = await client
.from("cart")
.select("id")
.eq("user_id",currentUser.id)
.eq("item_name",name)
.limit(1);

if(data.length > 0){

await client
.from("cart")
.delete()
.eq("id",data[0].id);

}

}

/* GUEST USER */
else{

let guestCart =
JSON.parse(localStorage.getItem("guestCart")) || [];

let index =
guestCart.findIndex(i=>i.item_name===name);

if(index > -1){
guestCart.splice(index,1);
}

localStorage.setItem("guestCart", JSON.stringify(guestCart));

}

loadCart();

}

/* ========================= */
/* ❌ REMOVE ALL */
/* ========================= */

async function removeAll(name){

/* LOGGED USER */
if(currentUser){

await client
.from("cart")
.delete()
.eq("user_id",currentUser.id)
.eq("item_name",name);

}

/* GUEST USER */
else{

let guestCart =
JSON.parse(localStorage.getItem("guestCart")) || [];

guestCart =
guestCart.filter(i=>i.item_name !== name);

localStorage.setItem("guestCart", JSON.stringify(guestCart));

}

showMessage("Item removed","success");

loadCart();

}

/* ========================= */
/* 💳 CHECKOUT */
/* ========================= */

function checkout(){

if(cart.length === 0){
showMessage("Cart is empty","error");
return;
}

/* 🚨 REQUIRE LOGIN HERE ONLY */
if(!currentUser){

localStorage.setItem("cartData", JSON.stringify(cart));

window.location.href = "index.html"; // login page
return;

}

/* LOGGED USER */
localStorage.setItem("cartData", JSON.stringify(cart));
window.location.href = "checkout.html";

}

/* ========================= */
/* LOGOUT */
/* ========================= */

async function logout(){
await client.auth.signOut();
location.reload();
}

</script>
