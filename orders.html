<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Order Status</title>

<style>

body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

/* NAVBAR */
.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
z-index: 1000;
box-shadow: 0 2px 5px rgba(0,0,0,0.3);
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.navbar a:hover{
color:#00ffcc;
}

.cart-count{
background:red;
color:white;
border-radius:50%;
padding:3px 8px;
font-size:12px;
margin-left:5px;
}

.main{
margin-top:80px;
}

header{
background:#007bff;
color:white;
text-align:center;
padding:15px;
font-size:24px;
}

.container{
background:white;
width:90%;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.item{
background:#f1f1f1;
padding:8px;
margin-top:5px;
border-radius:5px;
}

.status{
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.wait{ color:#ff9800; }
.ready{ color:green; }

.queue-info{
margin-top:10px;
font-size:18px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#0056b3;
}

</style>
</head>
<body>

<div class="navbar">

<a href="menu.html">Menu</a>

<a href="cart.html">
Cart <span class="cart-count" id="cartCount">0</span>
</a>

<a href="orders.html">My Order</a>

<a href="track.html">Track Order</a>

<a href="index.html">Logout</a>

</div>

<div class="main">

<header>My Order Status</header>

<div class="container">

<div id="orderDetails">Loading...</div>

<button onclick="goMenu()">Order More Food</button>

</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* PASTE YOUR SUPABASE DETAILS */
const SUPABASE_URL = "https://hbofboaoixzxqzouncyj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* GET STUDENT REG */
let studentReg =
localStorage.getItem("studentReg");

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

function updateCartCount(){
document.getElementById("cartCount").innerText =
cart.length;
}

/* LOAD ORDER FROM SUPABASE */
async function loadOrder(){

if(!studentReg){

document.getElementById("orderDetails").innerHTML =
"Please login first";
return;

}

let { data, error } =
await supabase
.from("orders")
.select("*")
.eq("student_reg", studentReg)
.order("order_number", { ascending:false })
.limit(1);

if(error){

document.getElementById("orderDetails").innerHTML =
"Error loading order";

return;

}

if(!data || data.length === 0){

document.getElementById("orderDetails").innerHTML =
"No order found";

return;

}

let order = data[0];

/* GET CURRENT QUEUE POSITION */
let { data: queue } =
await supabase
.from("orders")
.select("order_number")
.lte("order_number", order.order_number);

let position =
queue.length - 1;

let waitTime =
position * 2;

let status =
position === 0 ? "READY" : "WAITING";

let statusClass =
position === 0 ? "ready" : "wait";

let items =
JSON.parse(order.items);

let itemsHTML = "";

items.forEach(item=>{
itemsHTML +=
`<div class="item">
${item.name} - Ksh ${item.price}
</div>`;
});

document.getElementById("orderDetails").innerHTML = `

<p><strong>Registration:</strong>
${order.student_reg}</p>

<p><strong>Queue Number:</strong>
${order.order_number}</p>

<p><strong>Students ahead:</strong>
${position}</p>

<p><strong>Estimated wait time:</strong>
${waitTime} minutes</p>

<p class="status ${statusClass}">
Status: ${status}
</p>

<p><strong>Items:</strong></p>

${itemsHTML}

`;

}

/* AUTO REFRESH */
setInterval(loadOrder,5000);

function goMenu(){
window.location.href="menu.html";
}

updateCartCount();
loadOrder();

</script>

</body>
</html>
