<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Order Status</title>

<style>
body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.main{
margin-top:80px;
}

header{
background:#007bff;
color:white;
text-align:center;
padding:15px;
font-size:24px;
}

.container{
background:white;
width:90%;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.item{
background:#f1f1f1;
padding:8px;
margin-top:5px;
border-radius:5px;
}

.status{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}
</style>
</head>
<body>

<div class="navbar">
<a href="menu.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Order</a>
<a href="track.html">Track Order</a>
<a href="admin.html">Admin</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

<header>My Order Status</header>

<div class="container">

<div id="orderDetails">Loading...</div>

<button onclick="goMenu()">Order More Food</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const supabaseClient = window.supabaseClient;

let currentUser=null;


/* INIT */
async function init(){

const { data:{ session } } =
await supabaseClient.auth.getSession();

if(!session){

window.location.href="index.html";
return;

}

currentUser=session.user;

loadOrder();

}

init();


/* LOAD ORDER */
async function loadOrder(){

const { data, error } =
await supabaseClient
.from("orders")
.select("*")
.eq("user_id", currentUser.id)
.order("order_number",{ascending:false})
.limit(1)
.single();

if(error){

document.getElementById("orderDetails").innerHTML =
"No order found";

return;

}


/* GET CURRENTLY SERVING */
const { data: serving } =
await supabaseClient
.from("orders")
.select("order_number")
.neq("status","Completed")
.order("order_number",{ascending:true})
.limit(1);

let currentlyServing =
serving.length > 0
? serving[0].order_number
: data.order_number;


/* CALCULATE POSITION */
let peopleAhead =
data.order_number - currentlyServing;

if(peopleAhead<0)peopleAhead=0;


/* ITEMS */
let items=JSON.parse(data.items);

let itemsHTML="";

items.forEach(item=>{

itemsHTML+=`
<div class="item">
${item.item_name} - Ksh ${item.price}
</div>
`;

});


document.getElementById("orderDetails").innerHTML=`

<b>Your Queue Number:</b> #${data.order_number}<br><br>

<b>Currently Serving:</b> #${currentlyServing}<br><br>

<b>People Ahead:</b> ${peopleAhead}<br><br>

<b>Status:</b> ${data.status}<br><br>

<b>Payment:</b> ${data.payment_status}<br><br>

<b>Items:</b><br>

${itemsHTML}

`;

}


/* AUTO REFRESH */
setInterval(loadOrder,3000);


function goMenu(){

window.location.href="menu.html";

}


async function logout(){

await supabaseClient.auth.signOut();

window.location.href="index.html";

}

</script>

</body>
</html>
