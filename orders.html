<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Order Status</title>

<style>

body{
font-family: Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
z-index: 1000;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.main{
margin-top:80px;
}

header{
background:#007bff;
color:white;
text-align:center;
padding:15px;
font-size:24px;
}

.container{
background:white;
width:90%;
max-width:400px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.item{
background:#f1f1f1;
padding:8px;
margin-top:5px;
border-radius:5px;
}

.status{
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.ready{color:green;}
.wait{color:#ff9800;}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

</style>
</head>
<body>

<div class="navbar">

<a href="menu.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Order</a>
<a href="track.html">Track Order</a>
<a href="#" onclick="logout()">Logout</a>

</div>

<div class="main">

<header>My Order Status</header>

<div class="container">

<div id="orderDetails">Loading...</div>

<button onclick="goMenu()">Order More Food</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client =
window.supabase.createClient(
"https://hbofboaoixzxqzouncyj.supabase.co",
"sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I"
);

/* PROTECT PAGE */
async function protectPage(){

const { data: { user } } =
await client.auth.getUser();

if(!user){

window.location.href="auth.html";

return;

}

}

protectPage();

/* LOAD ORDER */
async function loadOrder(){

const { data: { user } } =
await client.auth.getUser();

if(!user){

window.location.href="auth.html";
return;

}

let { data, error } =
await client
.from("orders")
.select("*")
.eq("user_id", user.id)
.order("order_number",{ascending:false})
.limit(1);

if(error || !data || data.length===0){

document.getElementById("orderDetails").innerHTML =
"No order found";

return;

}

let order = data[0];

let { data: queue } =
await client
.from("orders")
.select("order_number")
.lte("order_number",order.order_number);

let position = queue.length - 1;

let waitTime = position * 2;

let status =
position===0?"READY":"WAITING";

let items =
JSON.parse(order.items);

let itemsHTML="";

items.forEach(item=>{

itemsHTML+=`
<div class="item">
${item.name} - Ksh ${item.price}
</div>`;

});

document.getElementById("orderDetails").innerHTML = `

<p><strong>Queue Number:</strong>
${order.order_number}</p>

<p><strong>Students ahead:</strong>
${position}</p>

<p><strong>Estimated wait:</strong>
${waitTime} minutes</p>

<p class="status ${
status==="READY"?"ready":"wait"
}">
Status: ${status}
</p>

<p><strong>Items:</strong></p>

${itemsHTML}

`;

}

/* LOGOUT */
async function logout(){

await client.auth.signOut();

window.location.href="auth.html";

}

function goMenu(){

window.location.href="menu.html";

}

/* AUTO REFRESH */
setInterval(loadOrder,5000);

loadOrder();

</script>

</body>
</html>
