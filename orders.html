<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:#333;
padding:15px;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

.main{
margin-top:80px;
padding:20px;
max-width:500px;
margin-left:auto;
margin-right:auto;
}

.serving{
background:#28a745;
color:white;
padding:12px;
border-radius:8px;
margin-bottom:20px;
font-size:18px;
font-weight:bold;
text-align:center;
}

.order{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.queue{
background:#007bff;
color:white;
padding:8px;
border-radius:5px;
font-weight:bold;
margin-bottom:10px;
}

.item{
background:#f1f1f1;
padding:6px;
margin-top:5px;
border-radius:5px;
}

.total{
font-weight:bold;
margin-top:10px;
}

.waiting{color:orange;}
.preparing{color:blue;}
.ready{color:green;}
.completed{color:black;}

.payment-pending{color:red;}
.payment-approval{color:orange;}
.payment-paid{color:green;}

.info{
margin-top:5px;
font-weight:bold;
}

/* MESSAGE BOX */
#msgBox{
text-align:center;
margin-bottom:15px;
font-weight:bold;
}

.error{
color:red;
}

.success{
color:green;
}

</style>

</head>
<body>

<div class="navbar">
<a href="menu.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Orders</a>
<a href="track.html">Track Order</a>
<a href="admin.html">Admin</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

<div id="msgBox"></div>

<div id="currentlyServingBox" class="serving">
Loading queue...
</div>

<div id="ordersList">Loading orders...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const supabaseClient = window.supabaseClient;

let currentUser=null;

const msgBox =
document.getElementById("msgBox");


/* MESSAGE FUNCTION */
function showMessage(message,type){

msgBox.innerHTML=message;
msgBox.className=type;

}


/* INIT */
init();

async function init(){

const { data:{ session }, error } =
await supabaseClient.auth.getSession();

if(error || !session){

window.location.href="index.html";
return;

}

currentUser=session.user;

loadOrders();

}


/* LOAD ORDERS */
async function loadOrders(){

try{

/* GET CURRENTLY SERVING */
const { data: serving, error: servingError } =
await supabaseClient
.from("orders")
.select("order_number")
.not("order_number","is",null)
.neq("status","Completed")
.order("order_number",{ascending:true})
.limit(1);

if(servingError){

showMessage("Error loading queue","error");
return;

}

let currentlyServing =
(serving && serving.length>0)
? serving[0].order_number
: 0;

document.getElementById("currentlyServingBox").innerHTML =
"Currently Serving: #" + currentlyServing;


/* GET USER ORDERS */
const { data, error } =
await supabaseClient
.from("orders")
.select("*")
.eq("user_id", currentUser.id)
.order("order_number",{ascending:false});

if(error){

showMessage("Error loading your orders","error");
return;

}

if(!data || data.length===0){

ordersList.innerHTML="No orders found";
return;

}

let html="";

data.forEach(order=>{

let peopleAhead =
order.order_number-currentlyServing;

if(peopleAhead<0) peopleAhead=0;

let waitTime =
peopleAhead * 2;


/* STATUS CLASS */
let statusClass="waiting";

if(order.status==="Preparing") statusClass="preparing";
if(order.status==="Ready") statusClass="ready";
if(order.status==="Completed") statusClass="completed";


/* PAYMENT CLASS */
let paymentClass="payment-pending";

if(order.payment_status==="Pending Approval")
paymentClass="payment-approval";

if(order.payment_status==="Paid")
paymentClass="payment-paid";


/* ITEMS */
let itemsHTML="";
let total=0;

if(order.items){

let items = JSON.parse(order.items);

items.forEach(item=>{

total += item.price;

itemsHTML += `
<div class="item">
${item.item_name} - Ksh ${item.price}
</div>
`;

});

}


html+=`

<div class="order">

<div class="queue">
Queue Number: #${order.order_number}
</div>

<div class="info ${statusClass}">
Order Status: ${order.status}
</div>

<div class="info ${paymentClass}">
Payment Status: ${order.payment_status}
</div>

<div class="info">
People Ahead: ${peopleAhead}
</div>

<div class="info">
Estimated Wait: ${waitTime} minutes
</div>

<br>

<div>
<b>Items:</b>
${itemsHTML}
</div>

<div class="total">
Total Amount: Ksh ${total}
</div>

</div>

`;

});

ordersList.innerHTML=html;

}catch(err){

showMessage("Unexpected error occurred","error");

}

}


/* AUTO REFRESH */
setInterval(loadOrders,3000);


/* LOGOUT */
async function logout(){

await supabaseClient.auth.signOut();

window.location.href="index.html";

}

</script>

</body>
</html>
