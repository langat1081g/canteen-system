<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders</title>

<style>

/* RESET */
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:#eef2f7;
}

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
width:100%;
background:#1f2937;
padding:12px 10px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
z-index:1000;
}

.navbar a{
color:white;
text-decoration:none;
font-weight:bold;
padding:8px 12px;
border-radius:6px;
font-size:14px;
transition:0.2s;
}

.navbar a:hover{
background:#374151;
}

/* MAIN */
.main{
margin-top:70px;
padding:15px;
max-width:700px;
margin-left:auto;
margin-right:auto;
}

/* MESSAGE */
#msgBox{
text-align:center;
margin-bottom:10px;
font-weight:bold;
min-height:20px;
}

.error{
color:#dc2626;
}

.success{
color:#16a34a;
}

/* CURRENTLY SERVING */
.serving{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
padding:14px;
border-radius:12px;
margin-bottom:15px;
font-size:18px;
font-weight:bold;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* ORDER CARD */
.order{
background:white;
padding:16px;
margin-bottom:15px;
border-radius:14px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
transition:0.2s;
}

.order:hover{
transform:translateY(-2px);
box-shadow:0 6px 18px rgba(0,0,0,0.12);
}

/* QUEUE NUMBER */
.queue{
background:#2563eb;
color:white;
padding:8px;
border-radius:8px;
font-weight:bold;
margin-bottom:10px;
text-align:center;
}

/* INFO */
.info{
margin-top:5px;
font-weight:bold;
}

/* ITEMS */
.item{
background:#f3f4f6;
padding:8px;
margin-top:6px;
border-radius:6px;
}

/* TOTAL */
.total{
font-weight:bold;
margin-top:10px;
font-size:16px;
color:#111827;
}

/* STATUS COLORS */
.waiting{color:#ea580c;}
.preparing{color:#2563eb;}
.ready{color:#16a34a;}
.completed{color:#374151;}

.payment-pending{color:#dc2626;}
.payment-approval{color:#ea580c;}
.payment-paid{color:#16a34a;}

/* MOBILE FIX */
@media(max-width:480px){

.navbar{
gap:5px;
padding:10px 5px;
}

.navbar a{
font-size:13px;
padding:6px 8px;
}

.main{
padding:12px;
}

.serving{
font-size:16px;
padding:12px;
}

.order{
padding:14px;
}

}

</style>

</head>
<body>

<div class="navbar">
<a href="index.html">Menu</a>
<a href="cart.html">Cart</a>
<a href="orders.html">My Orders</a>
<a href="track.html">Track Order</a>
<a href="admin.html">Admin</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

<div id="msgBox"></div>

<div id="currentlyServingBox" class="serving">
Loading queue...
</div>

<div id="ordersList">Loading orders...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const supabaseClient = window.supabaseClient;

let currentUser=null;

const msgBox =
document.getElementById("msgBox");


function showMessage(message,type){

msgBox.innerHTML=message;
msgBox.className=type;

}

init();

async function init(){

const { data:{ session }, error } =
await supabaseClient.auth.getSession();

if(error || !session){

window.location.href="index.html";
return;

}

currentUser=session.user;

loadOrders();

}

async function loadOrders(){

try{

const { data: serving, error: servingError } =
await supabaseClient
.from("orders")
.select("order_number")
.not("order_number","is",null)
.neq("status","Completed")
.order("order_number",{ascending:true})
.limit(1);

if(servingError){

showMessage("Error loading queue","error");
return;

}

let currentlyServing =
(serving && serving.length>0)
? serving[0].order_number
: 0;

document.getElementById("currentlyServingBox").innerHTML =
"Currently Serving: #" + currentlyServing;


const { data, error } =
await supabaseClient
.from("orders")
.select("*")
.eq("user_id", currentUser.id)
.order("order_number",{ascending:false});

if(error){

showMessage("Error loading your orders","error");
return;

}

if(!data || data.length===0){

ordersList.innerHTML="No orders found";
return;

}

let html="";

data.forEach(order=>{

let peopleAhead =
order.order_number-currentlyServing;

if(peopleAhead<0) peopleAhead=0;

let waitTime =
peopleAhead * 2;

let statusClass="waiting";

if(order.status==="Preparing") statusClass="preparing";
if(order.status==="Ready") statusClass="ready";
if(order.status==="Completed") statusClass="completed";

let paymentClass="payment-pending";

if(order.payment_status==="Pending Approval")
paymentClass="payment-approval";

if(order.payment_status==="Paid")
paymentClass="payment-paid";

let itemsHTML="";
let total=0;

if(order.items){

let items = JSON.parse(order.items);

items.forEach(item=>{

total += item.price;

itemsHTML += `
<div class="item">
${item.item_name} - Ksh ${item.price}
</div>
`;

});

}

html+=`

<div class="order">

<div class="queue">
Queue Number: #${order.order_number}
</div>

<div class="info ${statusClass}">
Order Status: ${order.status}
</div>

<div class="info ${paymentClass}">
Payment Status: ${order.payment_status}
</div>

<div class="info">
People Ahead: ${peopleAhead}
</div>

<div class="info">
Estimated Wait: ${waitTime} minutes
</div>

<br>

<div>
<b>Items:</b>
${itemsHTML}
</div>

<div class="total">
Total Amount: Ksh ${total}
</div>

</div>

`;

});

ordersList.innerHTML=html;

}catch(err){

showMessage("Unexpected error occurred","error");

}

}

setInterval(loadOrders,3000);

async function logout(){

await supabaseClient.auth.signOut();

window.location.href="index.html";

}

</script>

</body>
</html>
