<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login / Sign Up</title>

<style>

body{
font-family: Arial;
background: linear-gradient(to right, #4facfe, #00f2fe);
margin: 0;
}

.navbar{
position: fixed;
top: 0;
left: 0;
width: 100%;
background: #333;
padding: 15px;
text-align:center;
}

.navbar a{
color:white;
margin:15px;
text-decoration:none;
}

.main{
margin-top:80px;
}

.container{
width:350px;
margin:100px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.switch{
text-align:center;
margin-top:10px;
cursor:pointer;
color:blue;
}

</style>
</head>
<body>

<div class="navbar">
<a href="#">Canteen System</a>
</div>

<div class="main">

<div class="container">

<h2 id="title">Login</h2>

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password" placeholder="Password" required>

<button onclick="handleAuth()" id="authBtn">Login</button>

<div class="switch" onclick="toggleMode()" id="switchText">
Create new account
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* PASTE YOUR SUPABASE VALUES */
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_PUBLIC_ANON_KEY_HERE";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let isLogin = true;

function toggleMode(){

isLogin = !isLogin;

document.getElementById("title").innerText =
isLogin ? "Login" : "Create Account";

document.getElementById("authBtn").innerText =
isLogin ? "Login" : "Sign Up";

document.getElementById("switchText").innerText =
isLogin ? "Create new account" : "Already have account? Login";

}

async function handleAuth(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

if(!email || !password){

alert("Enter email and password");
return;

}

if(isLogin){

/* LOGIN */
let { data, error } =
await supabase.auth.signInWithPassword({

email,
password

});

if(error){

alert(error.message);

}else{

localStorage.setItem("studentEmail", email);

alert("Login successful");

window.location.href="menu.html";

}

}else{

/* SIGN UP */
let { data, error } =
await supabase.auth.signUp({

email,
password

});

if(error){

alert(error.message);

}else{

alert("Account created successfully. You can login now.");

toggleMode();

}

}

}

/* AUTO LOGIN IF SESSION EXISTS */
async function checkSession(){

let { data } =
await supabase.auth.getSession();

if(data.session){

window.location.href="menu.html";

}

}

checkSession();

</script>

</body>
</html>
