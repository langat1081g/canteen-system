<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Payment</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

.container{
background:white;
max-width:400px;
margin:80px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
text-align:center;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:green;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:disabled{
background:gray;
cursor:not-allowed;
}

button:hover{
background:darkgreen;
}

.info{
background:#f1f1f1;
padding:10px;
margin-top:15px;
border-radius:5px;
}

</style>
</head>
<body>

<div class="container">

<h2>Payment</h2>

<div id="orderInfo">Loading...</div>

<div class="info">

Pay via MPESA<br><br>

Till Number:<br>
<b>123456</b><br><br>

After paying click button below

</div>

<button id="payBtn" onclick="confirmPayment()">
I HAVE PAID
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
"https://hbofboaoixzxqzouncyj.supabase.co",
"sb_publishable_Hgp6-35ojerC2XGJVfq2yg_cyTd3L4I"
);

let currentOrder = null;
let currentUser = null;


/* GET ORDER ID FROM URL */
function getOrderId(){

const params =
new URLSearchParams(window.location.search);

return params.get("order_id");

}


/* INIT PAGE */
async function init(){

const { data:{ session } } =
await supabase.auth.getSession();

if(!session){

window.location.href="auth.html";
return;

}

currentUser = session.user;

loadOrder();

}


/* LOAD ORDER */
async function loadOrder(){

const orderId = getOrderId();

if(!orderId){

document.getElementById("orderInfo").innerHTML =
"Invalid order link.";

return;

}

const { data, error } =
await supabase
.from("orders")
.select("*")
.eq("id", orderId)
.eq("user_id", currentUser.id)
.single();

if(error){

document.getElementById("orderInfo").innerHTML =
"Order not found.";

return;

}

currentOrder = data;

const items =
JSON.parse(currentOrder.items);

let total = 0;

items.forEach(item=>{
total += item.price;
});


document.getElementById("orderInfo").innerHTML =

`
Order Number: <b>${currentOrder.order_number}</b><br><br>

Total Amount: <b>Ksh ${total}</b><br><br>

Payment Status: <b>${currentOrder.payment_status}</b>
`;

}


/* CONFIRM PAYMENT */
async function confirmPayment(){

if(!currentOrder) return;

const btn =
document.getElementById("payBtn");

btn.disabled = true;
btn.innerText = "Processing...";

const { error } =
await supabase
.from("orders")
.update({
payment_status:"Pending Approval"
})
.eq("id", currentOrder.id);

if(error){

alert(error.message);

btn.disabled = false;
btn.innerText = "I HAVE PAID";

return;

}

alert("Payment submitted successfully.\nWaiting for admin approval.");

window.location.href = "orders.html";

}


/* START */
init();

</script>

</body>
</html>
